<!-- declares document type(HTML5) -->
<!DOCTYPE html> 
<!-- root element of web page -->
<html lang="en">
    <!-- contains meta data, title and links to css/js -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<!-- contains the visible content on the page -->
<body>
    <!-- Common Tags -->
    <h1> heading big</h1> to <h6> heading small</h6>
    <p>paragraph</p>
    <a>Hyperlink</a>
    <img>image
    <ul>unordered list</ul>, <ol>ordered list</ol>, <li>List Item</li>
    <table border="Add table lines">create table</table>,
     <tr>Table row</tr>, 
     <td>Table dimension</td>, 
     <th>Table Header</th>
    <div>division or section</div>
    <span>inline test grouping</span>
    <form></form>, <input> forms for user input



    <!-- Attributes: it contains the information about tags or elements -->
     <img src="image path" alt="alternate text" width="image size">


     <!-- HTML 5 Features:s -->
        <!--  Semantic Tag -->
        <header></header>
        <section></section>
        <nav></nav>
        <footer></footer>


        <!-- Multimedia -->
        <audio></audio>
        <video></video>

        <!-- Graphics -->
         <canvas></canvas>
         <svg></svg>

         <!-- APIs -->
          <Geoloaction></Geoloaction>
          <Webstorage></Webstorage>
          <Drag></Drag>
          <Drop></Drop>


          <!-- Form Enhancement -->
           <placeholder></placeholder>
           <required></required>
           <input type="email, date, range"><!--this is the new input type-->
</body>



</html>
