<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visiting Card</title>
</head>
<style>
    .card{
        /* background-color: #f0e29e; */
        width: 500px;
        background-color: #cfabab;
        height: 300px;
        margin:50px;
        position: relative;
     

    }
     .circle{
        background-color: rgb(196, 8, 52);
        width: 70px;
        height: 70px;
        position: absolute;
        top: 80px;
        left: 265px;
        z-index: 100;
        
        border-radius: 100%;

    }

    .line{
        background-color: rgb(196, 8, 52);
        width: 500px;
        height: 10px;
position: absolute;
        top: 195px;
        left: 58px;
        z-index: 100;


    }
    .box{
        background-color: #cfabab;
        width: 200px;
        height: 70px;
        position: absolute;
        top: 155px;
        left: 200px;
        z-index: 100;
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        /* color: aliceblue; */

    }
    .contact{
        background-color: #cfabab;
        width: 150px;
        height: 40px;
        position: absolute;
        top: 255px;
        left: 225px;
        z-index: 100;
        /* text-align: center; */
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #c40834;
        font-weight: bold;

    }
</style>
<body>
    <div class="card">
         </div>

       
       <div><div class="circle">
        </div>
        <div class="line">
             </div>
            <div class="box">
                <p>Sambhav Traders
                    <br>Trust. Taste. Tradition

                </p>
                

            </div>
      

        <div class="contact">
            <p>+91-9109346496</p>
            </div> 
       
        
        
  
    
</body>

</html>
